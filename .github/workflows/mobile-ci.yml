name: Mobile CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A PR and its branch push validate the same source; keep only the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx expo-doctor

  android-apk:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_PACKAGE: com.spidersu.worldmaps
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 923307762389-9g278rmrjcosnnvqeavlb469bp9kk1b7.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: npm ci
      - name: Prepare Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json, os
          config = {
            "project_info": {"project_number":"923307762389","project_id":"world-map-1","storage_bucket":"world-map-1.firebasestorage.app"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:923307762389:android:a79d671618eaf3874cb85c","android_client_info":{"package_name":"com.spidersu.worldmaps"}},
                        "oauth_client":[{"client_id":"923307762389-frv764cl7mp6ecie4q0j3ahv7r4koiuf.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.spidersu.worldmaps","certificate_hash":"5e8f16062ea3cd2c4a0d547876baa6f38cabf625"}},{"client_id":"923307762389-9g278rmrjcosnnvqeavlb469bp9kk1b7.apps.googleusercontent.com","client_type":3}],
                        "api_key":[{"current_key":"AIzaSyBqPUkvpq694_sk8HvZeccg6rxSWElZjN8"}]}],
            "configuration_version":"1"
          }
          with open("google-services.ci.json","w") as out: json.dump(config,out)
          PY
          echo "GOOGLE_SERVICES_JSON=./google-services.ci.json" >> "$GITHUB_ENV"
      - name: Build standalone development-signed preview
        run: npm run build:android:preview
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: world-maps-preview-apk
          path: |
            artifacts/world-maps-preview.apk
            artifacts/preview-metadata.json
          if-no-files-found: error
          retention-days: 14
