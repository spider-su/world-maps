name: Deploy Firebase friends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firebase/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase.yml

permissions:
  contents: read

concurrency:
  group: firebase-friends-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: firebase-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify workload identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_FIREBASE_DEPLOY_SA }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set GCP_WIF_PROVIDER in firebase-production environment variables"; exit 1; }
          test -n "$DEPLOY_SA" || { echo "::error::Set GCP_FIREBASE_DEPLOY_SA in firebase-production environment variables"; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          project_id: world-map-1
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Firebase CLI and function dependencies
        run: |
          npm install --no-save --ignore-scripts firebase-tools
          npm --prefix firebase/functions install --ignore-scripts
      - name: Deploy friends functions and Firestore rules
        run: npx firebase deploy --project world-map-1 --only functions:friends,firestore:rules --non-interactive
      - name: List deployed functions
        run: npx firebase functions:list --project world-map-1
