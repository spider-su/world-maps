name: Refresh App Check lockfile
on:
  push:
    branches: [feat/android-firebase-app-check]
    paths: [package.json]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/android-firebase-app-check
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Push generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(appcheck): update lockfile for native SDK"
            git push
          fi
