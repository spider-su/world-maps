name: Mobile CI

on:
  push:
    branches: [main, develop, 'codex/**', 'feat/**', 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npx expo-doctor

  android-apk:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_PACKAGE: com.spidersu.worldmaps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: npm ci
      - name: Build standalone development-signed preview
        run: npm run build:android:preview
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: world-maps-preview-apk
          path: |
            artifacts/world-maps-preview.apk
            artifacts/preview-metadata.json
          if-no-files-found: error
          retention-days: 14
